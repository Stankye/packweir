name: Assemblyline live qualification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    # Public-repository ubuntu-24.04: 4 CPUs, 16 GB RAM, 14 GB SSD storage.
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Check the bounded runner profile
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version
          python3 - <<'PY'
          import os, shutil, subprocess
          from pathlib import Path
          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          docker_root = Path(subprocess.check_output(['docker', 'info', '--format', '{{.DockerRootDir}}'], text=True).strip())
          for name, path in [('workspace', workspace), ('Docker', docker_root)]:
              free = shutil.disk_usage(path).free
              print(f'{name}: {free / 1024**3:.2f} GiB free')
              if free < 12 * 1024**3:
                  raise SystemExit(f'{name} needs at least 12 GiB free for pinned images, bounded Rust builds, and evidence; no runner files were deleted')
          PY
          # Required by the pinned Elasticsearch 8.10 appliance image.
          if [ "$(sysctl -n vm.max_map_count)" -lt 262144 ]; then
            sudo sysctl -w vm.max_map_count=262144
          fi
      - name: Qualify the real Assemblyline appliance and product
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          # SIGINT lets the runner persist its failure report and clean up its
          # uniquely named resources; the outer bound leaves time for upload.
          timeout --signal=INT --kill-after=240s 40m \
            python3 tests/assemblyline/live/run.py --output target/assemblyline-live/ci
      - name: Stage verified public evidence and upstream notices
        if: always()
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, sys
          from pathlib import Path, PurePosixPath

          workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          source = workspace / 'target/assemblyline-live/ci'
          destination = workspace / 'target/assemblyline-live-evidence'
          if source.resolve() != source or destination.resolve() != destination:
              raise SystemExit('Evidence roots must not contain symbolic links')
          destination.mkdir(parents=True, exist_ok=False)

          def read_regular(root, relative):
              if not isinstance(relative, str) or not relative or '\\' in relative or ':' in relative:
                  raise ValueError('Unsafe evidence path')
              name = PurePosixPath(relative)
              if name.is_absolute() or name.as_posix() != relative or any(part in ('.', '..') for part in name.parts):
                  raise ValueError('Unsafe evidence path: ' + relative)
              path = root
              for part in name.parts:
                  path = path / part
                  if path.is_symlink():
                      raise ValueError('Symbolic links are not evidence: ' + relative)
              if root not in path.resolve().parents or not path.is_file():
                  raise ValueError('Evidence is not a regular file beneath its root: ' + relative)
              if path.stat().st_size > 128 * 1024**2:
                  raise ValueError('Evidence file exceeds 128 MiB: ' + relative)
              return path.read_bytes()

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          # These are the three complete upstream notices, pinned by their
          # canonical LF text hashes so checkout line-ending conversion is safe.
          notices = {
              'tests/assemblyline/live/config.UPSTREAM-LICENSE': ('Assemblyline-MIT.txt', '603d78b114c839f96daa2847ada07d10d666d75cc214a75736b17d1d85417993'),
              'tools/assemblyline-yara/licenses/YARA-COPYING': ('YARA-BSD.txt', 'efdabc1c1f655528b8c3a59b03668d446746d87273fab76f8af800b6e8891bd2'),
              'tools/assemblyline-yara/licenses/yara-python-LICENSE': ('yara-python-Apache-2.0.txt', 'c6596eb7be8581c18be736c846fb9173b69eccf6ef94c5135893ec56bd92ba08'),
          }
          (destination / 'notices').mkdir()
          for relative, (name, expected) in notices.items():
              data = read_regular(workspace, relative)
              if sha(data.replace(b'\r\n', b'\n')) != expected:
                  raise ValueError('Pinned upstream notice changed: ' + relative)
              (destination / 'notices' / name).write_bytes(data)

          if not (source / 'report.json').is_file():
              print('::warning::No live report was produced; uploading verified upstream notices only')
              sys.exit(0)
          report_bytes = read_regular(source, 'report.json')
          report = json.loads(report_bytes)
          artifacts = report.get('artifacts')
          if not isinstance(artifacts, dict):
              raise ValueError('Report artifacts must be a positive path/hash allowlist')
          sys.path.insert(0, str(workspace / 'tests/assemblyline/live'))
          from run import shareable

          # Independently prevent generated appliance credentials from entering
          # the public artifact even if a future logging change echoes them.
          credentials = []
          for relative in ('stack/.env', 'stack/apikey'):
              if (source / relative).is_file():
                  raw = read_regular(source, relative).decode('utf-8')
                  if relative.endswith('apikey'):
                      credentials.append(raw.strip().encode())
                  else:
                      for line in raw.splitlines():
                          if '=' in line:
                              key, value = line.split('=', 1)
                              if value and any(part in key for part in ('PASSWORD', 'SECRET', 'KEY')):
                                  credentials.append(value.encode())
          verified, total = {}, len(report_bytes)
          for relative, expected in artifacts.items():
              if not shareable(PurePosixPath(relative)) or relative == 'report.json':
                  raise ValueError('Report requests a private or unapproved artifact: ' + relative)
              if not isinstance(expected, str) or not re.fullmatch('[a-f0-9]{64}', expected):
                  raise ValueError('Invalid evidence SHA256: ' + relative)
              data = read_regular(source, relative)
              if sha(data) != expected:
                  raise ValueError('Evidence SHA256 mismatch: ' + relative)
              total += len(data)
              if total > 512 * 1024**2:
                  raise ValueError('Verified evidence exceeds the 512 MiB staging bound')
              verified[relative] = data
          verified['report.json'] = report_bytes
          for relative, data in verified.items():
              if any(value and value in data for value in credentials):
                  raise ValueError('Generated appliance credential found in evidence: ' + relative)
          # Nothing from the report is copied until every path, hash, and
          # credential check succeeds. The raw stack directory is never copied.
          for relative, data in verified.items():
              path = destination / relative
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          print(f'Staged {len(artifacts)} verified artifacts, report status {report.get("status")}, and three complete upstream notices')
          PY
      - name: Upload sanitized live qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assemblyline-live-qualification
          path: target/assemblyline-live-evidence/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

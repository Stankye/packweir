# Local qualification only: fixed public fixture credentials, isolated networks, no published ports.
x-app: &app
  image: ${PACKWEIR_E2E_IMAGE:-packweir:e2e}
  build:
    context: ../..
  environment: &app-env
    DATABASE_URL: postgres://packweir:fixture-db@postgres/packweir
    PACKWEIR_ADMIN_TOKEN: fixture-admin-token-0000000000000000
    PACKWEIR_READ_TOKEN: fixture-read-token-00000000000000000
    AWS_ACCESS_KEY_ID: fixture-access-key
    AWS_SECRET_ACCESS_KEY: fixture-secret-key-000000000000000
    AWS_EC2_METADATA_DISABLED: "true"
    RUST_LOG: packweir=info
  volumes:
    - type: bind
      source: ${PACKWEIR_E2E_CONFIG:?Generated by run.py}
      target: /app/e2e.toml
      read_only: true
    - blobs:/data

x-client: &client
  networks: [clients]
  volumes:
    - ./:/tests:ro
  environment:
    PACKWEIR_READ_TOKEN: fixture-read-token-00000000000000000
  profiles: [clients]

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: packweir
      POSTGRES_USER: packweir
      POSTGRES_PASSWORD: fixture-db
    healthcheck:
      test: [CMD-SHELL, pg_isready -U packweir -d packweir]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [backend]
    volumes: [database:/var/lib/postgresql/data]

  object-store:
    image: rustfs/rustfs:1.0.4
    profiles: [s3]
    command: [/data]
    environment:
      RUSTFS_ACCESS_KEY: fixture-access-key
      RUSTFS_SECRET_KEY: fixture-secret-key-000000000000000
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: error
    networks: [backend]
    volumes: [objects:/data]

  java-fixture:
    image: maven:3.9-eclipse-temurin-21
    entrypoint: [sh, /tests/java-fixture.sh]
    network_mode: none
    volumes:
      - ./:/tests:ro
      - fixtures:/fixtures

  upstream:
    image: python:3.13-slim-bookworm
    command: [python, /tests/upstream.py]
    environment:
      STORAGE: ${PACKWEIR_E2E_STORAGE:-fs}
    depends_on:
      java-fixture:
        condition: service_completed_successfully
      object-store:
        condition: service_started
        required: false
    networks: [backend]
    volumes:
      - ./:/tests:ro
      - fixtures:/fixtures
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 45

  gateway:
    <<: *app
    command: [--config, /app/e2e.toml, serve]
    depends_on:
      postgres:
        condition: service_healthy
      upstream:
        condition: service_healthy
    networks: [backend, clients]
    healthcheck:
      test: [CMD, packweir, --config, /app/e2e.toml, health]
      interval: 2s
      timeout: 5s
      retries: 45

  image-defaults:
    image: ${PACKWEIR_E2E_IMAGE:-packweir:e2e}
    command: [serve]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    # No configuration or data mounts: exercise the image's own defaults and UID.

  worker:
    <<: *app
    command: [--config, /app/e2e.toml, worker]
    depends_on:
      gateway:
        condition: service_healthy
    networks: [backend]
    profiles: [worker]

  probe:
    <<: *client
    image: python:3.13-slim-bookworm
    command: [python, /tests/probe.py]
    environment:
      PACKWEIR_ADMIN_TOKEN: fixture-admin-token-0000000000000000
      PACKWEIR_READ_TOKEN: fixture-read-token-00000000000000000
    volumes:
      - ./:/tests:ro
      - fixtures:/fixtures:ro

  storage-check:
    image: python:3.13-slim-bookworm
    command: [python, /tests/storage_check.py]
    environment:
      STORAGE: ${PACKWEIR_E2E_STORAGE:-fs}
      PACKWEIR_READ_TOKEN: fixture-read-token-00000000000000000
    networks: [backend]
    volumes:
      - ./:/tests:ro
      - fixtures:/fixtures:ro
      - blobs:/data
    profiles: [clients]

  npm:
    <<: *client
    image: node:24-bookworm-slim
    command: [sh, /tests/clients/npm.sh]

  pip:
    <<: *client
    image: python:3.13-slim-bookworm
    command: [sh, /tests/clients/pip.sh]
    volumes:
      - ./:/tests:ro
      - fixtures:/fixtures:ro

  cargo:
    <<: *client
    image: rust:1-bookworm
    command: [sh, /tests/clients/cargo.sh]

  maven:
    <<: *client
    image: maven:3.9-eclipse-temurin-21
    entrypoint: [sh, /tests/clients/maven.sh]

  gradle:
    <<: *client
    image: gradle:8.14-jdk21
    entrypoint: [sh, /tests/clients/gradle.sh]

  nuget:
    <<: *client
    image: mcr.microsoft.com/dotnet/sdk:10.0
    command: [sh, /tests/clients/nuget.sh]

networks:
  backend:
    internal: true
  clients:
    internal: true
volumes:
  database:
  blobs:
  fixtures:
  objects:
